on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - next
  pull_request:
    branches:
      - master
name: Robot builder
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [ 17, 21, 25]
    name: Java ${{ matrix.java }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # To make git describe give the intended output
          fetch-tags: true
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Set SSH key
        if: github.event_name != 'pull_request'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - name: Add host key
        if: github.event_name != 'pull_request'
        run: ssh-keyscan mvn.javacard.pro >> ~/.ssh/known_hosts
      - name: Build
        run: ./mvnw -T1C -B --no-transfer-progress -U verify
      - name: Deploy package or snapshot
        if: github.event_name != 'pull_request' && matrix.java == '17'
        run: ./mvnw -B -U deploy
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.java == '17'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          body: "Release ${{ github.ref_name }}"
          prerelease: true # manually promoted
